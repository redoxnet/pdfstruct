name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Release v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          MESSAGE=$(printf '%s\n' "$COMMIT_MESSAGE" | head -n 1)
          VERSION=$(echo "$MESSAGE" | sed -n 's/^Release v\([0-9][0-9A-Za-z.+-]*\).*/\1/p')
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse a version from commit message: $MESSAGE"
            exit 1
          fi

          TAG="v${VERSION}"
          NOTES_FILE=RELEASENOTES.md
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE not found"
            exit 1
          fi

          # A pre-release suffix (e.g. -alpha.1) flags the release as a pre-release.
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease";; esac

          echo "Creating release $TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file "$NOTES_FILE" \
            $PRERELEASE
